<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Connect With Us - WEBORA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/social.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<section class="social-hero">
  <h1>CONNECT WITH <span>WEBORA</span></h1>
  <p>Follow us everywhere & stay updated with digital growth insights.</p>
</section>

<section class="social-section">
  <div class="social-grid">

    <!-- Instagram -->
    <div class="social-card instagram">
      <i class="fab fa-instagram"></i>
      <h3>Instagram</h3>
      <span>12.4K Followers</span>
      <a href="#" class="btn">Follow</a>
    </div>

    <!-- Facebook -->
    <div class="social-card facebook">
      <i class="fab fa-facebook-f"></i>
      <h3>Facebook</h3>
      <span>8.1K Followers</span>
      <a href="#" class="btn">Follow</a>
    </div>

    <!-- LinkedIn -->
    <div class="social-card linkedin">
      <i class="fab fa-linkedin-in"></i>
      <h3>LinkedIn</h3>
      <span>5.3K Connections</span>
      <a href="#" class="btn">Connect</a>
    </div>

    <!-- X -->
    <div class="social-card x">
      <i class="fab fa-x-twitter"></i>
      <h3>X (Twitter)</h3>
      <span>3.7K Followers</span>
      <a href="#" class="btn">Follow</a>
    </div>

    <!-- YouTube -->
    <div class="social-card youtube">
      <i class="fab fa-youtube"></i>
      <h3>YouTube</h3>
      <span>2.1K Subscribers</span>
      <a href="#" class="btn">Subscribe</a>
    </div>

    <!-- Discord -->
    <div class="social-card discord">
      <i class="fab fa-discord"></i>
      <h3>Discord</h3>
      <span>1.6K Members</span>
      <a href="#" class="btn">Join</a>
    </div>

  </div>
</section>

</body>
</html>
